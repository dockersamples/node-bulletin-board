name: Release Infrastructure with Terraform

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: "AWS Lab Access Key ID"
        required: true
        type: string
      aws_secret_access_key:
        description: "AWS Lab Secret Access Key"
        required: true
        type: string
      aws_session_token:
        description: "AWS Lab Session Token"
        required: true
        type: string

env:
  AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
  AWS_SESSION_TOKEN: ${{ inputs.aws_session_token }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  deploy-infrastructure:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Mask AWS Session Credentials
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        working-directory: bulletin-board-app/iac
        run: terraform init

      - name: Terraform Plan
        working-directory: bulletin-board-app/iac
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: bulletin-board-app/iac
        run: terraform apply --auto-approve tfplan

      - name: Verify Release
        working-directory: bulletin-board-app/iac
        run: terraform output
